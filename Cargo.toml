[package]
name = "supatype-engine"
version = "0.1.9"
edition = "2021"
authors = ["Supatype"]
description = "Supatype schema engine — closed source binary"
# No license field — proprietary, all rights reserved

[[bin]]
name = "supatype-engine"
path = "src/main.rs"

[[bin]]
name = "supatype-engine-server"
path = "src/server_main.rs"

[lib]
name = "supatype_engine"
path = "src/lib.rs"
# lib target supports both native CLI use and WASM compilation.
# Server-only deps (sqlx, tokio, etc.) are gated to non-wasm32 targets below.

# ─── Core deps (WASM-compatible) ─────────────────────────────────────────────

[dependencies]
# Serialisation — used by parser + generator, WASM-compatible
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Ordered map — preserves field insertion order from JSON input
indexmap = { version = "2", features = ["serde"] }

# Pure computation — wasm-compatible
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
petgraph = "0.7"
strsim = "0.11"
similar = "2"

# Terminal styling — zero-dependency, wasm-compatible
owo-colors = "4"

# ─── Server-only deps (excluded from wasm32 builds) ──────────────────────────

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "macros"] }

# HTTP server (used by supatype-engine-server binary)
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Timestamps for migration names (DB module only — uses system clock)
chrono = { version = "0.4", features = ["serde"] }

# ─── WASM-only deps ───────────────────────────────────────────────────────────

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

# ─── Dev dependencies ─────────────────────────────────────────────────────────

[dev-dependencies]
tokio-test = "0.4"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
