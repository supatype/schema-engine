[package]
name = "supatype-engine"
version = "0.1.0"
edition = "2021"
authors = ["Supatype"]
description = "Supatype schema engine — closed source binary"
# No license field — proprietary, all rights reserved

[[bin]]
name = "supatype-engine"
path = "src/main.rs"

[lib]
name = "supatype_engine"
path = "src/lib.rs"
# lib target enables future WASM compilation

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-native-tls", "macros"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Migration hashing
sha2 = "0.10"
hex = "0.4"

# Timestamps for migration names
chrono = { version = "0.4", features = ["serde"] }

# Topological sort for operation ordering
petgraph = "0.7"

# String similarity (rename detection)
strsim = "0.11"

# Text diffing (migration previews)
similar = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
tokio-test = "0.4"
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
