name: Publish Docker Image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Platform pair slug
        id: slug
        run: echo "pair=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            ENGINE_VERSION=${{ inputs.version }}
          cache-from: type=gha,scope=${{ steps.slug.outputs.pair }}
          cache-to: type=gha,mode=max,scope=${{ steps.slug.outputs.pair }}
          outputs: type=image,name=supatype/schema-engine,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.slug.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Decide whether to update Docker Hub latest tag
        id: docker_latest
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ inputs.version }}'
          VERSION_LC=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
          IS_PRE=false
          case "$VERSION_LC" in
            *alpha*|*beta*|*-rc*|*.rc.*|*preview*) IS_PRE=true ;;
          esac

          HAS_STABLE=false
          while IFS= read -r t; do
            [[ -z "${t:-}" ]] && continue
            rest="${t#v}"
            [[ "$rest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            HAS_STABLE=true
            break
          done < <(git tag -l 'v[0-9]*')

          if [[ "$IS_PRE" != true ]] || [[ "$HAS_STABLE" != true ]]; then
            echo "docker_push_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker_push_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: supatype/schema-engine
          tags: |
            type=raw,value=v${{ inputs.version }}
            type=raw,value=latest,enable=${{ steps.docker_latest.outputs.docker_push_latest == 'true' }}

      - name: Create multi-platform manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'supatype/schema-engine@sha256:%s ' *)
