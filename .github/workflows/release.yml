name: Release

on:
  push:
    tags:
      - "v*"
  # Release Please creates the tag with GITHUB_TOKEN, and GitHub does not fire workflows for refs
  # that token created: it is how recursive runs are prevented. So a release can exist, correctly
  # tagged, with no binary and no image behind it, and nothing says so. v0.3.3 went out that way.
  #
  # This is the way back in. Give it a tag that already exists and it builds and publishes exactly
  # what a tag push would have.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish, for example v0.3.3"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # The tag this run is for. `github.ref_name` is the tag on a push and the branch on a dispatch,
  # so every place that needs the version reads this instead.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # ─── The tag is the version, and the binary has to agree ────────────────────
  #
  # ENGINE_VERSION comes from CARGO_PKG_VERSION via build.rs, and it is not cosmetic: it is
  # bound to every row of _supatype migration history, written into the generated migration
  # header, and reported by the server. Cargo.toml sat at 0.1.0 while tags ran to v0.1.8, so
  # every migration ever applied recorded an engine version that was never released. Failing
  # here is how that stops recurring: a forgotten bump is a red release, not a quiet mislabel.
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Compare
        run: |
          TAG="${RELEASE_TAG#v}"
          CRATE="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "supatype-engine") | .version')"
          echo "tag: ${TAG}, Cargo.toml: ${CRATE}"
          if [ "${TAG}" != "${CRATE}" ]; then
            echo "::error::Tag v${TAG} does not match Cargo.toml ${CRATE}. Bump the crate version, or tag v${CRATE}."
            exit 1
          fi

  # ─── Run tests before building release artefacts ────────────────────────────
  test:
    needs: version
    name: Test
    runs-on: ubuntu-latest
    # The same Postgres CI's integration job uses. Without a database the integration suites skip,
    # and a skipped test has passed: a release could be cut having asserted nothing about anything
    # that touches Postgres, which is most of this engine.
    services:
      postgres:
        image: supatype/postgres:17-latest
        env:
          POSTGRES_USER: supatype_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U supatype_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      # wasm32 so `test_wasm_build` runs here rather than taking its "target not installed" branch.
      # It guards a break that only shows on that target: the library gates its sqlx and tokio
      # modules off wasm32, so a WASM-visible module reaching into a gated one builds clean on the
      # host and fails only there. That is not hypothetical, it reached main once. Skipping it is
      # the same silent pass SUPATYPE_FORCE_INTEGRATION_TESTS exists to prevent.
      #
      # The language SDK exec tests still skip here, deliberately: they need a dozen toolchains, and
      # ci.yml runs them on every push with SUPATYPE_FORCE_EXEC_TESTS. This one costs a target.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # SUPATYPE_FORCE_INTEGRATION_TESTS turns a skip into a failure, matching ci.yml. A release is
      # the one run where a silent skip costs the most, because the artefact ships.
      - name: Run tests
        env:
          DATABASE_URL: postgres://supatype_admin:postgres@localhost:5432/postgres
          SUPATYPE_FORCE_INTEGRATION_TESTS: "1"
        run: cargo test --workspace

  # ─── Cross-platform build matrix ────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            cross: false
          - target: linux-arm64
            runner: ubuntu-22.04
            rust_target: aarch64-unknown-linux-gnu
            cross: true
          - target: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            cross: false
          - target: darwin-amd64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            cross: false
          - target: windows-amd64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            cross: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (linux-arm64)
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install aarch64 strip (linux-arm64 cross-build)
        if: matrix.cross == true
        run: sudo apt-get update -qq && sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Build (native)
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Build (cross-compiled)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.rust_target }}

      - name: Prepare binary
        id: prep
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.runner }}" == "windows-2022" ]]; then EXT=".exe"; fi
          BIN_NAME="supatype-engine-${{ matrix.target }}${EXT}"
          cp "target/${{ matrix.rust_target }}/release/supatype-engine${EXT}" "${BIN_NAME}"
          echo "bin_name=${BIN_NAME}" >> "$GITHUB_OUTPUT"

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: |
          BIN="${{ steps.prep.outputs.bin_name }}"
          if [ "${{ matrix.cross }}" = "true" ]; then
            aarch64-linux-gnu-strip "$BIN"
          else
            strip "$BIN" || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: ${{ steps.prep.outputs.bin_name }}
          retention-days: 1

  # ─── Sign, upload to CDN, and create GitHub Release ─────────────────────────
  publish:
    name: Sign, Upload & Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Hetzner Object Storage — do not use configure-aws-credentials (it calls AWS STS).
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CDN_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.CDN_AWS_REGION }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          merge-multiple: true

      - name: Extract version
        id: version
        run: |
          VERSION="${RELEASE_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Generate checksums.sha256
        run: |
          sha256sum supatype-engine-* > checksums.sha256
          echo "=== checksums.sha256 ==="
          cat checksums.sha256

      - name: Install minisign
        run: sudo apt-get install -y minisign

      - name: Sign checksums.sha256
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          printf '%s' "$MINISIGN_PRIVATE_KEY" > /tmp/minisign.key
          echo "$MINISIGN_PASSWORD" | minisign \
            -S -s /tmp/minisign.key \
            -m checksums.sha256 \
            -t "supatype engine releases v${VERSION}"
          rm -f /tmp/minisign.key

      - name: Upload binaries + checksums to CDN
        run: |
          BASE="s3://${{ secrets.CDN_BUCKET }}/engine/v${VERSION}"
          EP="${{ secrets.CDN_ENDPOINT }}"

          for f in supatype-engine-*; do
            aws s3 cp "$f" "${BASE}/${f}" \
              --endpoint-url "${EP}" \
              --cache-control "public, max-age=31536000, immutable"
          done

          aws s3 cp checksums.sha256 "${BASE}/checksums.sha256" \
            --endpoint-url "${EP}" \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp checksums.sha256.minisig "${BASE}/checksums.sha256.minisig" \
            --endpoint-url "${EP}" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Update engine/latest.json
        run: |
          EP="${{ secrets.CDN_ENDPOINT }}"
          printf '{"version":"%s","date":"%s","checksums_url":"https://releases.supatype.com/engine/v%s/checksums.sha256"}\n' \
            "${VERSION}" "$(date -u +%Y-%m-%d)" "${VERSION}" > latest.json
          aws s3 cp latest.json \
            "s3://${{ secrets.CDN_BUCKET }}/engine/latest.json" \
            --endpoint-url "${EP}" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            supatype-engine-*
            checksums.sha256
            checksums.sha256.minisig

  # ─── Publish Docker image (reuses existing workflow) ────────────────────────
  publish-docker:
    name: Publish Docker Image
    needs: publish
    uses: ./.github/workflows/publish-docker.yml
    secrets: inherit
    with:
      version: ${{ needs.publish.outputs.version }}
