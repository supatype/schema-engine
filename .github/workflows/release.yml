name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: supatype-engine

jobs:
  # ── Validate: run tests before building release binaries ───────────────────
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify Cargo.toml version matches tag
        run: |
          cargo_version=$(cargo metadata --no-deps --format-version=1 | \
            python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          tag_version="${{ steps.version.outputs.version }}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Cargo.toml version ($cargo_version) does not match tag ($tag_version)"
            exit 1
          fi

      - run: cargo check --all-targets
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo check --lib --target wasm32-unknown-unknown

      - name: Run unit tests
        run: |
          cargo test --lib \
            --test parser_tests \
            --test differ_tests \
            --test migration_tests \
            --test evolution_tests

  # ── Build: compile binaries for all platforms ──────────────────────────────
  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-14
            platform: darwin-arm64
            ext: ""
          # macOS x64 (Intel)
          - target: x86_64-apple-darwin
            os: macos-13
            platform: darwin-x64
            ext: ""
          # Linux x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
            ext: ""
            use_cross: true
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-arm64
            ext: ""
            use_cross: true
          # Windows x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win-x64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Cross-compilation for Linux targets
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      # Prepare the binary with the correct naming convention:
      # supatype-engine-{version}-{os}-{arch}{ext}
      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          ARTIFACT_NAME="${{ env.BINARY_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.platform }}"
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" "$ARTIFACT_NAME"
          chmod +x "$ARTIFACT_NAME"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ARTIFACT_NAME="${{ env.BINARY_NAME }}-${{ steps.version.outputs.version }}-${{ matrix.platform }}.exe"
          cp "target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.exe" "$ARTIFACT_NAME"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"

      # Preserve debug symbols separately (not published to CDN)
      - name: Preserve debug symbols (macOS)
        if: runner.os == 'macOS'
        run: |
          DSYM_PATH="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}.dSYM"
          if [ -d "$DSYM_PATH" ]; then
            tar czf "debug-symbols-${{ matrix.platform }}.tar.gz" -C "target/${{ matrix.target }}/release" "${{ env.BINARY_NAME }}.dSYM"
          fi

      - name: Preserve debug symbols (Linux)
        if: runner.os == 'Linux'
        run: |
          # Debug symbols are stripped by the release profile, but if we built
          # with split-debuginfo they would be in a .debug file
          BINARY_PATH="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}"
          if command -v objcopy &> /dev/null && [ -f "$BINARY_PATH" ]; then
            objcopy --only-keep-debug "$BINARY_PATH" "debug-symbols-${{ matrix.platform }}.debug" 2>/dev/null || true
          fi

      # Check binary size (warn if > 20MB)
      - name: Check binary size
        shell: bash
        run: |
          SIZE=$(wc -c < "${{ env.ARTIFACT_NAME }}" | tr -d ' ')
          SIZE_MB=$(echo "scale=2; $SIZE / 1048576" | bc)
          echo "Binary size: ${SIZE_MB}MB"
          if [ "$SIZE" -gt 20971520 ]; then
            echo "::warning::Binary ${{ env.ARTIFACT_NAME }} is ${SIZE_MB}MB (exceeds 20MB target)"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: ${{ env.ARTIFACT_NAME }}

      - name: Upload debug symbols
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ matrix.platform }}
          path: debug-symbols-*
          if-no-files-found: ignore

  # ── Sign & Publish: generate checksums, sign, upload to CDN ────────────────
  publish:
    name: Sign & Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      # Generate consolidated checksums.sha256
      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: |
          sha256sum supatype-engine-* > checksums.sha256
          echo "=== checksums.sha256 ==="
          cat checksums.sha256

      # Sign the checksum file with minisign
      - name: Install minisign
        run: |
          curl -fsSL https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz \
            | tar xz
          sudo mv minisign-linux/x86_64/minisign /usr/local/bin/minisign
          minisign -v

      - name: Sign checksums with minisign
        working-directory: artifacts
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
        run: |
          # Write the private key to a temporary file.
          # The key stored in CI secrets must be unencrypted (no password)
          # since minisign has no non-interactive password input.
          # The password-protected copy is kept offline as a backup.
          echo "$MINISIGN_PRIVATE_KEY" > /tmp/minisign.key

          # Sign the checksum file
          minisign -S -s /tmp/minisign.key \
            -m checksums.sha256 \
            -t "supatype-engine v${{ steps.version.outputs.version }}" \
            -W

          # Clean up the key
          rm -f /tmp/minisign.key

          echo "=== checksums.sha256.minisig ==="
          cat checksums.sha256.minisig

      # Upload to Hetzner Object Storage (S3-compatible) via aws CLI
      - name: Upload to CDN (Hetzner Object Storage)
        working-directory: artifacts
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          BASE_PATH="engine/${VERSION}"

          # Upload all binaries with immutable cache headers
          for file in supatype-engine-*; do
            aws s3 cp "$file" "s3://${S3_BUCKET}/${BASE_PATH}/${file}" \
              --endpoint-url "${S3_ENDPOINT}" \
              --cache-control "public, max-age=31536000, immutable" \
              --content-type "application/octet-stream"
          done

          # Upload checksum file and signature with immutable cache headers
          aws s3 cp checksums.sha256 "s3://${S3_BUCKET}/${BASE_PATH}/checksums.sha256" \
            --endpoint-url "${S3_ENDPOINT}" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "text/plain"

          aws s3 cp checksums.sha256.minisig "s3://${S3_BUCKET}/${BASE_PATH}/checksums.sha256.minisig" \
            --endpoint-url "${S3_ENDPOINT}" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/octet-stream"

      # Update latest.json and versions.json manifests
      - name: Update release manifests
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date -u +%Y-%m-%d)
          CDN_BASE="https://releases.supatype.io/engine"

          # Generate latest.json
          cat > /tmp/latest.json <<EOF
          {
            "version": "${VERSION}",
            "date": "${DATE}",
            "checksums_url": "${CDN_BASE}/v${VERSION}/checksums.sha256"
          }
          EOF
          # Remove leading whitespace from heredoc
          python3 -c "import json,sys; d=json.load(open('/tmp/latest.json')); json.dump(d,open('/tmp/latest.json','w'),indent=2)"

          # Download existing versions.json or create empty array
          aws s3 cp "s3://${S3_BUCKET}/engine/versions.json" /tmp/existing-versions.json \
            --endpoint-url "${S3_ENDPOINT}" 2>/dev/null || echo "[]" > /tmp/existing-versions.json

          # Prepend new version entry
          python3 - <<'PYEOF'
          import json

          version = "${VERSION}"
          date = "${DATE}"
          cdn_base = "${CDN_BASE}"

          new_entry = {
              "version": version,
              "date": date,
              "binaries": {
                  "linux-x64": f"{cdn_base}/v{version}/supatype-engine-{version}-linux-x64",
                  "linux-arm64": f"{cdn_base}/v{version}/supatype-engine-{version}-linux-arm64",
                  "darwin-x64": f"{cdn_base}/v{version}/supatype-engine-{version}-darwin-x64",
                  "darwin-arm64": f"{cdn_base}/v{version}/supatype-engine-{version}-darwin-arm64",
                  "win-x64": f"{cdn_base}/v{version}/supatype-engine-{version}-win-x64.exe"
              },
              "checksums_url": f"{cdn_base}/v{version}/checksums.sha256",
              "signature_url": f"{cdn_base}/v{version}/checksums.sha256.minisig",
              "changelog_url": f"{cdn_base}/v{version}/CHANGELOG-v{version}.md"
          }

          with open("/tmp/existing-versions.json") as f:
              versions = json.load(f)

          # Remove existing entry for this version if re-releasing
          versions = [v for v in versions if v.get("version") != version]
          versions.insert(0, new_entry)

          with open("/tmp/versions.json", "w") as f:
              json.dump(versions, f, indent=2)
          PYEOF

          # Upload latest.json with no-cache (always serve fresh)
          aws s3 cp /tmp/latest.json "s3://${S3_BUCKET}/engine/latest.json" \
            --endpoint-url "${S3_ENDPOINT}" \
            --cache-control "no-cache" \
            --content-type "application/json"

          # Upload versions.json with no-cache
          aws s3 cp /tmp/versions.json "s3://${S3_BUCKET}/engine/versions.json" \
            --endpoint-url "${S3_ENDPOINT}" \
            --cache-control "no-cache" \
            --content-type "application/json"

      # Upload changelog if it exists
      - name: Upload changelog
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: eu-central-1
          S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          if [ -f "CHANGELOG.md" ]; then
            aws s3 cp CHANGELOG.md "s3://${S3_BUCKET}/engine/${VERSION}/CHANGELOG-${VERSION}.md" \
              --endpoint-url "${S3_ENDPOINT}" \
              --cache-control "public, max-age=31536000, immutable" \
              --content-type "text/markdown"
          fi

      # Create GitHub Release on this repository
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/supatype-engine-*
            artifacts/checksums.sha256
            artifacts/checksums.sha256.minisig
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Also publish to the public engine-releases fallback repository
      - name: Upload to fallback GitHub Releases repo
        env:
          GH_TOKEN: ${{ secrets.ENGINE_RELEASES_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.version }}"

          # Skip if the token is not configured
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ENGINE_RELEASES_TOKEN not set, skipping fallback repo upload"
            exit 0
          fi

          # Create release on public fallback repo
          gh release create "$VERSION" \
            --repo supatype/engine-releases \
            --title "Supatype Engine $VERSION" \
            --notes "Binary release of Supatype Engine $VERSION. Source code is proprietary. See https://supatype.io for documentation." \
            --prerelease=${{ contains(github.ref_name, '-') }} \
            artifacts/supatype-engine-* \
            artifacts/checksums.sha256 \
            artifacts/checksums.sha256.minisig \
            || echo "::warning::Failed to create fallback release (non-fatal)"
