name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── The tag is the version, and the binary has to agree ────────────────────
  #
  # ENGINE_VERSION comes from CARGO_PKG_VERSION via build.rs, and it is not cosmetic: it is
  # bound to every row of _supatype migration history, written into the generated migration
  # header, and reported by the server. Cargo.toml sat at 0.1.0 while tags ran to v0.1.8, so
  # every migration ever applied recorded an engine version that was never released. Failing
  # here is how that stops recurring: a forgotten bump is a red release, not a quiet mislabel.
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          echo "tag: ${TAG}, Cargo.toml: ${CRATE}"
          if [ "${TAG}" != "${CRATE}" ]; then
            echo "::error::Tag v${TAG} does not match Cargo.toml ${CRATE}. Bump the crate version, or tag v${CRATE}."
            exit 1
          fi

  # ─── Run tests before building release artefacts ────────────────────────────
  test:
    needs: version
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # ─── Cross-platform build matrix ────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            cross: false
          - target: linux-arm64
            runner: ubuntu-22.04
            rust_target: aarch64-unknown-linux-gnu
            cross: true
          - target: darwin-arm64
            runner: macos-14
            rust_target: aarch64-apple-darwin
            cross: false
          - target: darwin-amd64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            cross: false
          - target: windows-amd64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            cross: false

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (linux-arm64)
        if: matrix.cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install aarch64 strip (linux-arm64 cross-build)
        if: matrix.cross == true
        run: sudo apt-get update -qq && sudo apt-get install -y binutils-aarch64-linux-gnu

      - name: Build (native)
        if: matrix.cross == false
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Build (cross-compiled)
        if: matrix.cross == true
        run: cross build --release --target ${{ matrix.rust_target }}

      - name: Prepare binary
        id: prep
        shell: bash
        run: |
          EXT=""
          if [[ "${{ matrix.runner }}" == "windows-2022" ]]; then EXT=".exe"; fi
          BIN_NAME="supatype-engine-${{ matrix.target }}${EXT}"
          cp "target/${{ matrix.rust_target }}/release/supatype-engine${EXT}" "${BIN_NAME}"
          echo "bin_name=${BIN_NAME}" >> "$GITHUB_OUTPUT"

      - name: Strip binary (Unix)
        if: runner.os != 'Windows'
        run: |
          BIN="${{ steps.prep.outputs.bin_name }}"
          if [ "${{ matrix.cross }}" = "true" ]; then
            aarch64-linux-gnu-strip "$BIN"
          else
            strip "$BIN" || true
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-${{ matrix.target }}
          path: ${{ steps.prep.outputs.bin_name }}
          retention-days: 1

  # ─── Sign, upload to CDN, and create GitHub Release ─────────────────────────
  publish:
    name: Sign, Upload & Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Hetzner Object Storage — do not use configure-aws-credentials (it calls AWS STS).
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.CDN_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.CDN_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.CDN_AWS_REGION }}
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: engine-*
          merge-multiple: true

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Generate checksums.sha256
        run: |
          sha256sum supatype-engine-* > checksums.sha256
          echo "=== checksums.sha256 ==="
          cat checksums.sha256

      - name: Install minisign
        run: sudo apt-get install -y minisign

      - name: Sign checksums.sha256
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_PRIVATE_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          printf '%s' "$MINISIGN_PRIVATE_KEY" > /tmp/minisign.key
          echo "$MINISIGN_PASSWORD" | minisign \
            -S -s /tmp/minisign.key \
            -m checksums.sha256 \
            -t "supatype engine releases v${VERSION}"
          rm -f /tmp/minisign.key

      - name: Upload binaries + checksums to CDN
        run: |
          BASE="s3://${{ secrets.CDN_BUCKET }}/engine/v${VERSION}"
          EP="${{ secrets.CDN_ENDPOINT }}"

          for f in supatype-engine-*; do
            aws s3 cp "$f" "${BASE}/${f}" \
              --endpoint-url "${EP}" \
              --cache-control "public, max-age=31536000, immutable"
          done

          aws s3 cp checksums.sha256 "${BASE}/checksums.sha256" \
            --endpoint-url "${EP}" \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 cp checksums.sha256.minisig "${BASE}/checksums.sha256.minisig" \
            --endpoint-url "${EP}" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Update engine/latest.json
        run: |
          EP="${{ secrets.CDN_ENDPOINT }}"
          printf '{"version":"%s","date":"%s","checksums_url":"https://releases.supatype.com/engine/v%s/checksums.sha256"}\n' \
            "${VERSION}" "$(date -u +%Y-%m-%d)" "${VERSION}" > latest.json
          aws s3 cp latest.json \
            "s3://${{ secrets.CDN_BUCKET }}/engine/latest.json" \
            --endpoint-url "${EP}" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            supatype-engine-*
            checksums.sha256
            checksums.sha256.minisig

  # ─── Publish Docker image (reuses existing workflow) ────────────────────────
  publish-docker:
    name: Publish Docker Image
    needs: publish
    uses: ./.github/workflows/publish-docker.yml
    secrets: inherit
    with:
      version: ${{ needs.publish.outputs.version }}
