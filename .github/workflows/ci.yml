name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: a PR stacked on another PR's branch merges into main
  # through that branch, so checking only PRs into main left the stacked ones unchecked.
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      # Verify the lib compiles to WASM (no DB deps, no tokio)
      - run: cargo check --lib --target wasm32-unknown-unknown

  licences:
    name: Licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nothing is compiled here, but both tools read every dependency's sources.
      - uses: Swatinem/rust-cache@v2
      # Pinned so THIRD-PARTY-NOTICES regenerates byte for byte: a newer cargo-about may lay it out
      # differently. Bump the pin and the committed file together.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
      # The engine ships under BUSL-1.1, so no dependency may be copyleft. deny.toml is the list.
      - run: cargo deny check licenses
      # The notices ship beside the binary; a dependency change that leaves them stale fails here.
      - name: THIRD-PARTY-NOTICES is current
        run: |
          cargo about generate about.hbs -o THIRD-PARTY-NOTICES
          git diff --exit-code -- THIRD-PARTY-NOTICES \
            || { echo "::error::THIRD-PARTY-NOTICES is stale. Run: cargo about generate about.hbs -o THIRD-PARTY-NOTICES"; exit 1; }
      # release.yml refuses a tag whose LICENSE lacks its version and Change Date, using the script
      # release-please.yml writes them with. Prove both directions here, before a release needs it.
      - name: The licence parameters can be set and checked
        run: bash scripts/licence-parameters.sh selftest

  test:
    name: Unit & Evolution Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Every suite in `tests/` must appear in one of this workflow's `--test` lists, or it
      # never runs: `cargo test --test X` builds only the targets it names. `ci_coverage_tests`
      # fails the build when a file here is not listed anywhere, which is how 15 suites came to
      # be dead weight on main.
      - name: Run all non-integration tests
        run: |
          cargo test --lib \
            --test ci_coverage_tests \
            --test licence_tests \
            --test parser_tests \
            --test differ_tests \
            --test migration_tests \
            --test evolution_tests \
            --test normaliser_tests \
            --test owner_validation_tests \
            --test owner_relation_rules_tests \
            --test schema_name_boundary_tests \
            --test column_type_match_tests \
            --test standup_regression_tests \
            --test field_access_tests \
            --test field_access_validation_tests \
            --test field_write_privileges_tests \
            --test versions_tests \
            --test admin_labels_tests \
            --test generated_types_contract_tests \
            --test generated_types_relationships_tests \
            --test generated_types_blocks_tests \
            --test exact_value_types_tests \
            --test sdk_exact_value_types_tests \
            --test column_shape_tests \
            --test constraint_names_tests \
            --test storage_grant_tests \
            --test storage_rule_tests \
            --test seed_ir_tests \
            --test seed_validate_tests \
            --test seed_plan_tests \
            --test conformance_tests \
            --test identity_generated_tests \
            --test sql_quote_lint

  sdk-exec:
    name: SDK Exec Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # ── Python ──────────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Go ──────────────────────────────────────────────────────────────────
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # ── PHP ─────────────────────────────────────────────────────────────────
      - name: Install PHP (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y php-cli
      - name: Install PHP (macOS)
        if: runner.os == 'macOS'
        run: brew install php

      # ── Swift ───────────────────────────────────────────────────────────────
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.10"

      # ── Kotlin ──────────────────────────────────────────────────────────────
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
      - name: Install Kotlin
        run: |
          KOTLIN_VERSION=2.0.21
          curl -fsSL "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip" -o kotlin.zip
          unzip -q kotlin.zip -d "$HOME/kotlin"
          echo "$HOME/kotlin/kotlinc/bin" >> "$GITHUB_PATH"

      # ── Dart ────────────────────────────────────────────────────────────────
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      # ── Run all exec tests ──────────────────────────────────────────────────
      - name: Run SDK exec tests (hard-fail, all toolchains present)
        env:
          SUPATYPE_FORCE_EXEC_TESTS: "1"
        run: cargo test --test sdk_exec_tests -- --nocapture

  integration:
    name: Integration Tests (supatype/postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supatype/postgres:17-latest
        # Service images are pulled before any step runs, so a login step cannot cover this one.
        # Anonymous Docker Hub pulls are rate-limited per runner IP and were failing with 429
        # toomanyrequests. Where secrets are withheld (fork and Dependabot PRs) both values are
        # empty, and the runner skips the registry login when either is empty and pulls
        # anonymously, so those runs behave as before instead of failing.
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_USER: supatype_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U supatype_admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # SUPATYPE_FORCE_INTEGRATION_TESTS turns a skip into a failure. Without it, a suite that
      # cannot reach the database, or an image without `supatype_mask`, returns early from the
      # test body and reports green having asserted nothing.
      - name: Run integration tests
        env:
          DATABASE_URL: postgres://supatype_admin:postgres@localhost:5432/postgres
          SUPATYPE_FORCE_INTEGRATION_TESTS: "1"
        run: |
          cargo test \
            --test integration_test \
            --test migration_conversion_integration \
            --test grants_tests \
            --test rls_convergence_tests \
            --test auth_server_migration_tests \
            --test seed_execute_tests \
            --test seed_ledger_tests \
            --test seed_command_tests \
            --test richtext_trigger_tests \
            --test schema_isolation_tests \
            --test studio_members_tests \
            --test studio_identity_links_tests \
            --test studio_state_security_tests \
            --test table_adoption_tests \
            --test live_state_tests \
            --test engine_version_tests \
            --test storage_policy_sweep_tests \
            --test table_ownership_tests \
            --test field_access_contract_tests \
            --test field_access_tamper_tests \
            --test field_masking_tier_selection_tests \
            --test tier_two_api_tests \
            --test field_bounds_enforcement_tests \
            --test versions_runtime_tests \
            --test ownership_evidence_tests \
            --test owner_scalar_field_tests \
            --test introspection_coverage_tests \
            --test catalog_introspection_tests \
            --test fingerprint_tests \
            --test project_schema_guard_tests \
            --test introspection_budget_tests \
            --test golden_tests \
            --test desired_objects_tests \
            --test statement_attribution_tests \
            --test ledger_tests \
            --test push_orchestrator_tests \
            --test extension_schema_tests \
            --test check_ledger_tests \
            --test model_constraint_names_tests \
            --test phase3_acceptance_tests \
            --test one_migration_tests \
            --test foreign_key_ledger_tests \
            --test trigger_ledger_tests \
            --test index_ledger_tests \
            --test versions_ledger_tests \
            --test view_ledger_tests \
            --test label_ledger_tests \
            --test policy_ledger_tests \
            --test grant_ledger_tests \
            --test rls_ledger_tests \
            --test column_ledger_tests \
            --test declared_rename_tests \
            --test push_audit_tests \
            --test key_schema_sequence_ledger_tests \
            --test doctor_ledger_tests \
            --test identity_generated_db_tests \
            --test table_ledger_tests \
            --test rebaseline_tests \
            --test rebaseline_preview_tests \
            --test security_consent_tests \
            --test rollback_ledger_tests \
            --test migrate_file_tests \
            --test replica_identity_tests \
            --test object_names_tests \
            --test name_stability_tests \
            --test sql_quoting_tests \
            --test concurrency_tests \
            --test online_ddl_tests \
            --test push_lock_retry_tests \
            --test needless_lock_tests \
            --test writer_lock_wait_tests \
            --test unanalysed_table_tests \
            --test graphql_affordance_tests \
            --test api_owner_role_tests \
            --test doctor_notes_tests \
            --test sequence_grant_tests \
            --test database_owner_tests
