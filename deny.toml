# cargo-deny: which licences the engine's dependencies may carry.
#
# The engine ships as a binary under the Business Source License, so every dependency compiled
# into it must carry a permissive licence. A copyleft crate (GPL, LGPL, AGPL, MPL, EPL, SSPL and
# the like) would put obligations on the binary that BSL cannot meet, so it is refused. CI runs
# `cargo deny check licenses` on every pull request.
#
# The notices these licences require ship beside the binary in THIRD-PARTY-NOTICES, generated by
# cargo-about from about.toml. cargo-about cannot read this file, so its `accepted` list repeats
# the one below: change both together (CI fails at whichever one is missed).

[graph]
all-features = true
# Dev dependencies are never compiled into a shipped binary; about.toml leaves them out too.
exclude-dev = true

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# The engine itself is BUSL-1.1 and `publish = false`; it is the licensor's own crate, not a
# dependency, so it is not held to the list above.
[licenses.private]
ignore = true
